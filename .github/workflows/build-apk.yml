name: Build Iceraven APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK and Build Tools 37.0.0
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find /usr/local/lib/android/sdk -name "sdkmanager" -type f 2>/dev/null | head -n 1)
          fi
          yes | "$SDKMANAGER" --sdk_root=/usr/local/lib/android/sdk --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root=/usr/local/lib/android/sdk "build-tools;37.0.0" "platforms;android-35"

      - name: Setup local.properties
        run: echo "autosignReleaseWithDebugKey=" > local.properties

      - name: Fix com.android.lint plugin version in conventions
        run: |
          if [ -f plugins/conventions/build.gradle.kts ]; then
            sed -i 's/id("com.android.lint") version "9.4.1"/id("com.android.lint") apply false/g' plugins/conventions/build.gradle.kts
            sed -i "s/id('com.android.lint') version '9.4.1'/id('com.android.lint') apply false/g" plugins/conventions/build.gradle.kts
          fi

      - name: Build APK
        run: ./gradlew assembleForkRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iceraven-apk
          path: app/build/outputs/apk/forkRelease/*.apk