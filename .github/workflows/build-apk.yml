name: Build Iceraven APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK and Build Tools 37.0.0
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find /usr/local/lib/android/sdk -name "sdkmanager" -type f 2>/dev/null | head -n 1)
          fi
          yes | "$SDKMANAGER" --sdk_root=/usr/local/lib/android/sdk --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root=/usr/local/lib/android/sdk "build-tools;37.0.0" "platforms;android-35"

      - name: Setup mozconfig.json and local.properties
        run: |
          echo "autosignReleaseWithDebugKey=" > local.properties
          [ -f version.txt ] || echo "132.0.0" > version.txt
          if [ ! -f mozconfig.json ]; then
            cat << 'EOF' > mozconfig.json
          {
            "substs": {
              "MOZ_APPSERVICES_IN_TREE": false,
              "DOWNLOAD_ALL_GRADLE_DEPENDENCIES": false,
              "GRADLE_MAVEN_REPOSITORIES": [
                "https://maven.mozilla.org/maven2/",
                "https://dl.google.com/dl/android/maven2/",
                "https://repo.maven.apache.org/maven2/",
                "https://plugins.gradle.org/m2/"
              ]
            }
          }
          EOF
          fi

      - name: Build APK
        run: ./gradlew assembleForkRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iceraven-apk
          path: app/build/outputs/apk/forkRelease/*.apk